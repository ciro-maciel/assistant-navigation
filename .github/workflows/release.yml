name: Tabhand — release

# A version tag (v1.2.3) packages the extension and attaches it to the GitHub release.
on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: scripts/package-extension.sh
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" dist/tabhand-extension.zip --title "Tabhand $GITHUB_REF_NAME" --generate-notes
